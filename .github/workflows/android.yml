name: Build Keripik Sakinah Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          # Prefer the repository root when it is a complete Android Gradle project.
          if { [[ -f settings.gradle ]] || [[ -f settings.gradle.kts ]]; } \
             && { [[ -f app/build.gradle ]] || [[ -f app/build.gradle.kts ]]; } \
             && [[ -f app/src/main/AndroidManifest.xml ]]; then
            PROJECT_DIR="."
          else
            # This also supports repositories where the complete project is nested
            # inside a folder such as keripik_sakinah_android_desktop_android/.
            while IFS= read -r settings_file; do
              candidate="${settings_file%/*}"
              if [[ "$candidate" == "$settings_file" ]]; then
                candidate="."
              fi
              if { [[ -f "$candidate/app/build.gradle" ]] || [[ -f "$candidate/app/build.gradle.kts" ]]; } \
                 && [[ -f "$candidate/app/src/main/AndroidManifest.xml" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -not -path '*/node_modules/*' | sort)
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Android Gradle project was not found."
            echo "Expected settings.gradle and app/build.gradle in the same project directory."
            echo "Repository files at top level:"
            ls -la
            exit 1
          fi

          echo "Detected Android project directory: $PROJECT_DIR"
          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p "$ANDROID_PROJECT_DIR" assembleDebug

      - name: Check APK output
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$ANDROID_PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "ERROR: APK was not generated at $APK_PATH"
            find "$ANDROID_PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: keripik-sakinah-debug-apk
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
